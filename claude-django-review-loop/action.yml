name: 'Claude Django Code Review (Loop)'
description: 'AI-powered Django code review with configurable round limit (default 5)'
author: 'drtail'

inputs:
  anthropic_api_key:
    description: 'Anthropic API Key'
    required: true
  github_token:
    description: 'GitHub Token for PR operations'
    required: true
  review_language:
    description: 'Language for review output'
    required: false
    default: 'Korean'
  trigger_label:
    description: 'Label name that triggers the review'
    required: false
    default: '🤖 AI Review'
  allowed_bots:
    description: 'Comma-separated list of bot names allowed to trigger review'
    required: false
    default: ''
  linear_api_key:
    description: 'Linear API key (org secret) — resolves linked Linear issues for AC context'
    required: false
    default: ''
  slack_bot_token:
    description: 'Slack bot token (org secret) — resolves linked Slack threads'
    required: false
    default: ''
  notion_api_key:
    description: 'Notion integration token (org secret) — resolves linked Notion pages'
    required: false
    default: ''
  sentry_api_token:
    description: 'Sentry API token (org secret) — resolves linked Sentry issues'
    required: false
    default: ''

  max_rounds:
    description: 'Maximum review rounds (positive integer); existing callers keep 5'
    required: false
    default: '5'
  pr_number:
    description: 'Optional target PR number for manual workflows; otherwise use the event PR'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Resolve review PR and validate inputs
      id: resolve_pr
      uses: actions/github-script@v7
      env:
        REQUESTED_PR: ${{ inputs.pr_number }}
        MAX_ROUNDS: ${{ inputs.max_rounds }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const positiveInteger = (value, name) => {
            const text = String(value).trim();
            const number = Number(text);
            if (!/^[1-9]\d*$/.test(text) || !Number.isSafeInteger(number)) {
              throw new Error(`${name} must be a positive safe integer.`);
            }
            return number;
          };
          const maxRounds = positiveInteger(process.env.MAX_ROUNDS, 'max_rounds');
          const requested = process.env.REQUESTED_PR.trim()
            || context.payload.pull_request?.number || context.issue.number || '';
          const number = positiveInteger(requested, 'pr_number');
          const { data: pr } = await github.rest.pulls.get({
            ...context.repo, pull_number: number,
          });
          if (!pr.head.repo || !/^[a-f0-9]{40}$/i.test(pr.head.sha)) {
            throw new Error('The PR must have an available head repository and commit.');
          }
          core.setOutput('pr_number', String(pr.number));
          core.setOutput('head_sha', pr.head.sha);
          core.setOutput('head_repository', pr.head.repo.full_name);
          core.setOutput('pr_body', pr.body || '');
          core.setOutput('pr_context', JSON.stringify(pr));
          core.setOutput('max_rounds', String(maxRounds));

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.resolve_pr.outputs.head_repository }}
        ref: ${{ steps.resolve_pr.outputs.head_sha }}
        fetch-depth: 0

    - name: Count rounds
      id: count_rounds
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          let currentRound = 1;
          let page = 1;
          const maxPages = 3;

          while (page <= maxPages) {
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
              per_page: 100,
              page: page
            });

            if (comments.data.length === 0) break;

            for (const comment of comments.data) {
              if (
                comment.user.type === 'Bot' &&
                comment.body &&
                comment.body.includes('<!-- ai-review-round:')
              ) {
                currentRound++;
              }
            }

            if (comments.data.length < 100) break;
            page++;
          }

          core.setOutput('round_number', currentRound);
          console.log(`Current round: ${currentRound}`);

    - name: Check max rounds
      id: check_max_rounds
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const roundNumber = Number('${{ steps.count_rounds.outputs.round_number }}');
          const maxRounds = Number('${{ steps.resolve_pr.outputs.max_rounds }}');

          if (roundNumber > maxRounds) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
              body: `## 🔄 AI Review 최대 회차 초과\n\n${maxRounds}회차 리뷰가 완료되었습니다. 더 이상 자동 리뷰를 진행하지 않습니다. 개발자가 직접 검토해 주세요.`
            });
            console.log('Max rounds exceeded. Setting skip flag.');
            core.setOutput('should_skip', 'true');
          } else {
            console.log(`Round ${roundNumber} - proceeding with review`);
            core.setOutput('should_skip', 'false');
          }

    - name: Fetch previous reviews
      id: fetch_previous_reviews
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          let page = 1;
          const maxPages = 3;
          const reviewComments = [];

          while (page <= maxPages) {
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
              per_page: 100,
              page: page
            });

            if (comments.data.length === 0) break;

            for (const comment of comments.data) {
              if (
                comment.user.type === 'Bot' &&
                comment.body &&
                comment.body.includes('<!-- ai-review-round:')
              ) {
                const match = comment.body.match(/<!-- ai-review-round:\s*(\d+)\s*-->/);
                const roundNum = match ? parseInt(match[1]) : 0;
                reviewComments.push({ round: roundNum, body: comment.body });
              }
            }

            if (comments.data.length < 100) break;
            page++;
          }

          reviewComments.sort((a, b) => a.round - b.round);
          const recent = reviewComments.slice(-2);

          let combinedText = '';
          for (const review of recent) {
            const truncated = review.body.length > 3000
              ? review.body.substring(0, 3000) + '...(truncated)'
              : review.body;
            combinedText += `[회차 ${review.round} 리뷰]\n${truncated}\n\n`;
          }

          core.setOutput('previous_reviews', combinedText);
          console.log(`Fetched ${recent.length} previous review(s)`);

    - name: Minimize old comments
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          let page = 1;
          const maxPages = 3;

          while (page <= maxPages) {
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
              per_page: 100,
              page: page
            });

            if (comments.data.length === 0) break;

            for (const comment of comments.data) {
              if (comment.body && comment.body.includes('Claude Django Code Review')) {
                try {
                  await github.graphql(`
                    mutation($id: ID!) {
                      minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                        clientMutationId
                      }
                    }
                  `, { id: comment.node_id });
                  console.log(`Minimized comment ${comment.id} by ${comment.user.login}`);
                } catch (error) {
                  console.log(`Failed to minimize comment ${comment.id}: ${error.message}`);
                }
              }
            }

            if (comments.data.length < 100) break;
            page++;
          }

    - name: Parse ignore list
      id: parse_ignore_list
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      uses: actions/github-script@v7
      env:
        PR_BODY: ${{ steps.resolve_pr.outputs.pr_body }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const body = process.env.PR_BODY || '';
          const items = [];

          const sectionMatch = body.match(/# 🚫 AI Review Ignore([\s\S]*?)(?=\n# |$)/);
          if (sectionMatch) {
            const sectionContent = sectionMatch[1];
            const lines = sectionContent.split('\n');
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('- [P2]')) {
                items.push(trimmed);
              }
            }
          }

          core.setOutput('ignore_list', JSON.stringify(items));
          core.setOutput('ignore_count', items.length.toString());
          console.log(`Parsed ${items.length} ignore item(s)`);

    - name: Fetch external context (Linear/Slack/Notion/Sentry)
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      shell: bash
      env:
        PR_BODY: ${{ steps.resolve_pr.outputs.pr_body }}
        LINEAR_API_KEY: ${{ inputs.linear_api_key }}
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        NOTION_API_KEY: ${{ inputs.notion_api_key }}
        SENTRY_API_TOKEN: ${{ inputs.sentry_api_token }}
      run: |
        python3 "${GITHUB_ACTION_PATH}/../scripts/fetch_pr_context.py" || echo "context fetch skipped (non-fatal)"

    - name: Pick review model/effort by PR size
      id: tier
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      uses: actions/github-script@v7
      env:
        ACTION_DIR: ${{ github.action_path }}
        PR_CONTEXT: ${{ steps.resolve_pr.outputs.pr_context }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const pick = require(`${process.env.ACTION_DIR}/../scripts/review_tier.js`);
          const pullRequest = JSON.parse(process.env.PR_CONTEXT);
          const reviewContext = {
            ...context,
            repo: context.repo,
            issue: { ...context.issue, number: pullRequest.number },
            payload: { ...context.payload, pull_request: pullRequest },
          };
          const { lines, split } = await pick({ github, context: reviewContext, core, profile: 'small' });
          // 500줄 초과: 관점별 하위 리뷰어(Agent 도구)로 나눠 보고 합친다 (DRT-6999).
          const fs = require('fs');
          const splitPrompt = split
            ? fs.readFileSync(`${process.env.ACTION_DIR}/split-review.md`, 'utf8').replace('__LINES__', String(lines))
            : '';
          core.setOutput('split_prompt', splitPrompt);
          core.setOutput('extra_tools', split ? ',Agent,Task' : '');

    - name: Clear only the pending review output
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      shell: bash
      run: rm -f -- .claude-code-review.md

    - name: Generate Django Code Review
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      uses: anthropics/claude-code-action@v1
      env:
        # 분할 리뷰의 하위 리뷰어(Agent)를 앞단에서 돌려 결과가 같은 턴에 돌아오게 한다.
        # 헤드리스 실행은 메인 턴이 끝나면 종료돼, 백그라운드 하위 리뷰어를 기다리지 않으면
        # 리뷰 파일 없이 끝난다 (DRT-6999 실측: 'agents report back' 후 종료 → ENOENT).
        CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '900000'
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        allowed_bots: ${{ inputs.allowed_bots }}
        show_full_output: true
        prompt: |
          REVIEW CONTEXT:
          - Current round: ${{ steps.count_rounds.outputs.round_number }}
          - Previous reviews: ${{ steps.fetch_previous_reviews.outputs.previous_reviews }}
          - Ignore list (P2 items author marked as acceptable): ${{ steps.parse_ignore_list.outputs.ignore_list }}
          - Review mode: ${{ steps.tier.outputs.split == 'true' && 'SPLIT (see SPLIT REVIEW MODE below)' || 'single reviewer' }}
          - External context: a file `.pr-context.md` in the repo root may hold the linked Linear issue(s) and Slack/Notion/Sentry content resolved from the PR description. If it exists, READ IT FIRST with the Read tool — it is the source of truth for what this PR must deliver. Do NOT invent context for links it reports as failed/unreadable.

          SCOPE — Items already covered by automated tools (DO NOT report these):
          - Code style/formatting → covered by Ruff
          - Type errors → covered by mypy
          - Module import direction violations → covered by import-linter
          - Wording of log messages, comments, docstrings, or Korean text; naming taste; readability-only refactors
          - Micro-optimizations with no measurable impact on a hot path
          CONFIDENCE: if you are speculating ("could potentially…", "might…") and cannot name the line and the concrete failure, it is at most `[P3]` — never P1/P2.
          DO report: architectural violations beyond import direction (e.g., business logic in wrong layer), N+1 queries, logic bugs, security issues.

          If round 2+, focus on:
          1. Whether previous P1/P2 issues have been resolved
          2. New issues introduced since last review
          3. P1 items in ignore list are invalid — flag them

          **Acceptance Criteria (REQUIRED CHECK):** The PR description's Acceptance Criteria (- [ ] checkboxes) are this PR's contract. Cross-check them against BOTH the linked Linear issue in `.pr-context.md` and the actual diff:
          - Every AC must be fully implemented by this PR — verify each against the code (cite file:line). Missing or partial AC → `[P1]`.
          - The PR must implement its AC exactly — no more, no less. Flag scope creep (substantive changes with no matching AC) as `[P2]`.
          - If the PR's AC diverge from the linked Linear issue's acceptance criteria, flag the mismatch.

          ${{ steps.tier.outputs.split_prompt }}

          ---

          REPO: ${{ github.repository }}
          PR NUMBER: ${{ steps.resolve_pr.outputs.pr_number }}
          REVIEWED HEAD SHA: ${{ steps.resolve_pr.outputs.head_sha }}
          Review this checked-out SHA. If the PR head changes, do not claim the new head was reviewed.

          You are a senior Django backend engineer reviewing this PR.
          First, read the project's CLAUDE.md file (if it exists) to understand project-specific conventions, architecture patterns, and coding standards. Apply those conventions throughout your review.

          **Critical Analysis Areas (in priority order):**

          1. **Database Query Efficiency (HIGHEST PRIORITY):**
             - Trace complete query execution paths: ViewSet.queryset → Serializer → nested Serializers → SerializerMethodField
             - Identify ALL N+1 queries by checking every ForeignKey/relation access
             - Verify select_related/prefetch_related coverage matches actual usage
             - Check for inefficient patterns: redundant queries, unnecessary count(), missing bulk operations
             - Analyze queryset usage in EACH view method separately
             - Test passing does NOT prove query efficiency — recommend query count assertions where missing

          2. **Architecture (per project conventions):**
             - Check CLAUDE.md for the project's layer responsibilities (e.g., views, serializers, services/usecases, tasks)
             - Verify business logic is placed in the correct layer
             - Flag any layer boundary violations

          3. **Security:**
             - Authentication/permission gaps
             - SQL injection, XSS risks
             - Sensitive data exposure

          4. **Test Quality:**
             - Follow project-specific test conventions from CLAUDE.md
             - Check for proper exception handling assertions
             - Verify use of model enums instead of hardcoded strings
             - Verify coverage of key status codes (200, 400, 401, 403, 404)

          **Priority Levels (Pn Rule):**
          - **P1**: Critical bugs - security vulnerabilities, data loss, crashes (MUST fix)
          - **P2**: Convention violations, performance issues requiring improvement (SHOULD fix)
          - **P3**: Suggested improvements, better practices (COULD fix)
          - **P4**: Minor suggestions, style preferences (CONSIDER)
          - **P5**: Nitpicks, optional enhancements (FYI)

          **Review Decision Criteria:**
          - P1 or unignored P2 issues found → REQUEST_CHANGES
          - Only P3-P5 issues or explicitly accepted ignore-list P2 issues found → COMMENT
          - All good → APPROVE

          **Output Requirements:**
          - Write entire review in ${{ inputs.review_language }}
          - Start with review decision header (## ❌ REQUEST CHANGES / ## 💬 COMMENT / ## ✅ APPROVED)
          - Format each review item: `` `[Pn]` `` badge (backtick-wrapped) + descriptive title, file:line reference, explanation
          - Group related items under category headings
          - End with conclusion section restating the decision
          - Do NOT mention "CLAUDE.md" in your review output
          - Use the backtick `[Pn]` badge ONLY for issues that are still open in this round. When you mention a previous round's item that is now resolved, write it without backticks (e.g. "P2 (해소)").
          - Use the decision header exactly once, as the first line. REQUEST CHANGES requires at least one open P1/P2 issue.
          - If P1=0 and P2=0, include this exact standalone machine-readable sentence: `No open P1/P2 issues.`
          - The final TWO lines must be exactly `<!-- open-issues: P1=<n> P2=<n> -->` then `<!-- reviewed-sha: ${{ steps.resolve_pr.outputs.head_sha }} -->`. Use each marker once. Counts include only issues still open this round; accepted ignore-list P2 issues still count. Never claim a SHA other than the checked-out SHA above.
          - Provide concrete code examples where helpful

          **Self-Check Before Finalizing:**
          - Re-read the PR diff and confirm every changed file is covered
          - Confirm all database queries are traced end-to-end
          - Confirm no security issues were overlooked
          - Confirm file:line references are accurate

          IMPORTANT: Never write files to /tmp/ or any directory outside the repository root.

          Save your ${{ inputs.review_language }} review to a file named '.claude-code-review.md' using Write tool. Do NOT post to PR yet.

        claude_args: '--model ${{ steps.tier.outputs.model }} --effort ${{ steps.tier.outputs.effort }} --allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Write,Read,Glob,Grep${{ steps.tier.outputs.extra_tools }}"'

    - name: Post review with marker
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      uses: actions/github-script@v7
      env:
        REVIEWED_PR_BODY: ${{ steps.resolve_pr.outputs.pr_body }}
        REVIEW_VALIDATOR_PATH: ${{ github.action_path }}/scripts/validate-review.cjs
        IGNORE_COUNT: ${{ steps.parse_ignore_list.outputs.ignore_count }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { data: currentPR } = await github.rest.pulls.get({
            ...context.repo,
            pull_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
          });
          if (currentPR.head.sha !== '${{ steps.resolve_pr.outputs.head_sha }}'
              || (currentPR.body || '') !== process.env.REVIEWED_PR_BODY) {
            throw new Error('PR head or body changed during review; rerun on the current PR.');
          }

          const fs = require('fs');

          let review;
          try {
            review = fs.readFileSync('.claude-code-review.md', 'utf8');
          } catch (error) {
            console.error('Failed to read .claude-code-review.md:', error);
            core.setFailed('Review file not found. Claude review may have failed.');
            return;
          }

          const parseReview = require(process.env.REVIEW_VALIDATOR_PATH);
          parseReview(
            review, '${{ steps.resolve_pr.outputs.head_sha }}',
            Number(process.env.IGNORE_COUNT || '0')
          );
          const roundNumber = '${{ steps.count_rounds.outputs.round_number }}';

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
            body: `## Claude Django Code Review (Round ${roundNumber})\n\n${review}\n\n<sub>🧠 ${{ steps.tier.outputs.model }} · effort ${{ steps.tier.outputs.effort }} · ${{ steps.tier.outputs.lines }}줄 (lock 파일 제외)</sub>\n\n<!-- ai-review-round: ${roundNumber} -->`
          });

          console.log(`Review posted successfully (Round ${roundNumber})`);

    - name: Evaluate approve/reject
      if: steps.check_max_rounds.outputs.should_skip != 'true'
      uses: actions/github-script@v7
      env:
        REVIEWED_PR_BODY: ${{ steps.resolve_pr.outputs.pr_body }}
        REVIEW_VALIDATOR_PATH: ${{ github.action_path }}/scripts/validate-review.cjs
        IGNORE_COUNT: ${{ steps.parse_ignore_list.outputs.ignore_count }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const { data: currentPR } = await github.rest.pulls.get({
            ...context.repo,
            pull_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
          });
          if (currentPR.head.sha !== '${{ steps.resolve_pr.outputs.head_sha }}'
              || (currentPR.body || '') !== process.env.REVIEWED_PR_BODY) {
            throw new Error('PR head or body changed during review; rerun on the current PR.');
          }

          const fs = require('fs');

          let review;
          try {
            review = fs.readFileSync('.claude-code-review.md', 'utf8');
          } catch (error) {
            throw new Error('Review file missing during evaluation.');
          }

          const roundNumber = parseInt('${{ steps.count_rounds.outputs.round_number }}');
          const parseReview = require(process.env.REVIEW_VALIDATOR_PATH);
          const { decision, p1, p2: p2Count } = parseReview(
            review, '${{ steps.resolve_pr.outputs.head_sha }}',
            Number(process.env.IGNORE_COUNT || '0')
          );
          const hasP1 = p1 > 0;
          const ignoreCount = parseInt(process.env.IGNORE_COUNT || '0');

          console.log(`Round: ${roundNumber}, P1: ${hasP1}, P2 count: ${p2Count}, IgnoreCount: ${ignoreCount}`);

          // P1 is never ignorable; approve (any round) when no P1 and P2 count covered by ignore list.
          // Round 1 approval ends the loop — matches the team rule "R1 APPROVED 면 종료" (DRT-6998).
          if (decision !== '❌ REQUEST CHANGES'
              && !hasP1 && (p2Count === 0 || p2Count <= ignoreCount)) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
              body: `## ✅ AI Review APPROVED\n\n${roundNumber}회차 리뷰 완료. P1 없음, P2 ${p2Count}건 (무시 사유 ${ignoreCount}건). LGTM!\n\n<!-- reviewed-sha: ${{ steps.resolve_pr.outputs.head_sha }} -->`
            });
            console.log('APPROVED comment posted');
          } else {
            console.log('Not approved yet - P1 or unignored P2 remain');
          }

    - name: Remove AI Review label
      if: success()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ steps.resolve_pr.outputs.pr_number }}'),
              name: '${{ inputs.trigger_label }}'
            });
            console.log('Removed "${{ inputs.trigger_label }}" label after successful review');
          } catch (error) {
            console.log(`Failed to remove label: ${error.message}`);
          }

    - name: Cleanup review files
      if: always()
      shell: bash
      run: |
        rm -f .claude-code-review*.md .pr-context.md
        echo "Cleaned up review files"
